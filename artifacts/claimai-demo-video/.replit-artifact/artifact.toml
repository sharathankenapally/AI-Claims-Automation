kind = "video"
previewPath = "/claimai-demo-video/"
title = "ClaimAI Demo Video"
version = "1.0.0"
id = "artifacts/claimai-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/claimai-demo-video/" ]
localPort = 18904

[services.development]
run = "pnpm --filter @workspace/claimai-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/claimai-demo-video", "run", "build" ]
publicDir = "artifacts/claimai-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18904"
BASE_PATH = "/claimai-demo-video/"
